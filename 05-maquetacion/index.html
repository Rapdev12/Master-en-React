<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <title>Proyecto de Peliculas</title>
</head>

<body>

    <div class="layout">
        <!--Header-->

        <header class="header">
            
            <div class="logo">
                <div class="play"></div>
            </div>

            <h1>Movie fans</h1>
        </header>

        <!--Navigation bar -->
        <nav class="nav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

        </nav>

        <!--Main content -->
        <section class="content">
            <!--Movies  -->
            <article class="movie-items">
                <img src="css/img/evildeadburn.jpeg" class="movie-img">
                <h3 class="title">Evil dead Burn</h3>
                <p class="description">Movie Description</p>
                <button class="edit">Edit</button>
                <button class="delete">Delete</button>
            </article>

            <article class="movie-items">
                <img src="css/img/superman.jpeg" class="movie-img">
                <h3 class="title">Superman</h3>
                <p class="description">Movie Description</p>
                <button class="edit">Edit</button>
                <button class="delete">Delete</button>
            </article>

            <article class="movie-items">
                <img src="css/img/silenthill.jpg" class="movie-img">
                <h3 class="title">Silent Hill</h3>
                <p class="description">Movie Description</p>
                <button class="edit">Edit</button>
                <button class="delete">Delete</button>
            </article>

            <article class="movie-items">
                <img src="css/img/Batman.jpg" class="movie-img">
                <h3 class="title">Batman</h3>
                <p class="description">Movie Description</p>
                <button class="edit">Edit</button>
                <button class="delete">Delete</button>
            </article>
        </section>

        <!--Side content -->
        <aside class="side">
            <div class="search">
                <h3 class="title"> Movie search </h3>
                <form action="">
                    <input type="text">
                    <button> Search </button>
                </form>
            </div>

            <div class="add">
                <h3 class="title">Add Movies</h3>
                <form action="">
                    <input type="text" placeholder="Title">
                    <textarea placeholder="Descriptions"></textarea>
                    <input type="submit" value="Saves">
                </form>
            </div>
        </aside>

        <!--Footer content -->
        <footer class="footer">
            &copy;Ronald Palacios Web Developer
        </footer>


    </div>



</body>

</html>
